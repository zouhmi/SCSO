# SCSO - Silent Client Staff Only.
#
# Everything here is optional: what you see is what the plugin uses by default. After
# editing, run /scso reload (or restart the server) to apply the change.

# Silent Client's public username lookup returns { account: { username, user_id, ... } }.
# The account's current rank list is then retrieved by numeric user_id.
api-base-url: https://api.silentclient.net
connect-timeout-ms: 2500
request-timeout-ms: 5000
# If the API is unreachable, deny new logins. This avoids accidentally admitting
# non-staff during an outage. Set false to allow joins during API outages.
# Whitelisted names (whitelist.yml, managed with /scso whitelist add) and pinned ranks
# (ranks.yml, /scso rank set) are never affected by this and need no lookup at all.
fail-closed: true
kick-message: '&cThis server is restricted to Silent Client staff.'
lookup-failed-message: '&cCould not verify your Silent Client staff rank. Please try again shortly.'

# Which Silent Client ranks count as staff. Matching is case-insensitive and trims
# whitespace, and the service's own keys are checked too ("senior_tech_support").
# Removing a rank here denies it at login. How a rank looks is configured further down.
staff-ranks:
  - Tester
  - Senior Tester
  - Tech Support
  - Senior Tech Support
  - Client Mod
  - Senior Client Mod
  - Tester Manager
  - Client Mod Manager
  - Admin
  - Senior Admin
  - Developer
  - Owner

# --- How the rank looks -------------------------------------------------------------
# Every format understands %rank% ([Rank] in the rank's colour), %rank_plain% (the rank
# name without brackets), %name% and, in chat, %message%.
chat-format: '%rank% %name% >> %message%'
# The tab list format. %name% is the split point handed to TAB: everything before it
# becomes the tab prefix and everything after it the suffix, so the rank follows the
# player when the format is reordered. Without TAB the whole format is one list name.
tab-format: '%rank% %name%'
# The player's own name, above their head and in the hover text.
display-name-format: '%rank% %name%'

# Change any rank, including the ones Silent Client reports. A bare value is a colour when
# it looks like #RRGGBB; the long form takes color, priority and label. A label the service
# does not have becomes a rank you can hand out with /scso rank set.
# custom-ranks:
#   Senior Tech Support:
#     color: '#00AAFF'
#   Head of Staff:
#     color: '#FF0000'
#     priority: 90
#   Legend: '#FFAA00'
custom-ranks: {}

# Per-player rank pins: what an admin has decided somebody is shown as, regardless of what
# Silent Client reports. With rank-override-grants-access they also let that player join.
# /scso rank set writes to ranks.yml, which wins over this section.
# rank-overrides:
#   SomePlayer: Head of Staff
rank-overrides: {}
rank-override-grants-access: true

# --- TAB (NEZNAMY) ------------------------------------------------------------------
# TAB owns the tab list while it is installed, so the rank is pushed through TAB's API.
# Set false to leave TAB completely alone.
tab-integration: true
# When TAB is hooked, also show the rank prefix above the player's head through TAB.
tab-nametag-prefix: true
# Force a sorting team onto every staff member, so they are not sorted to the bottom of
# the tab list (TAB warns "group (none) is not in sorting list"). The team has to be one
# TAB knows about, for example 'admin'. Leave empty to leave TAB's sorting alone.
tab-sort-team: ''

# A rank must have a valid service-provided hex color. Malformed colors fall back to white.
cache:
  ttl-seconds: 300
  max-entries: 10000
